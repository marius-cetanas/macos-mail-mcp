name: CI

on:
  push:
    branches: [main]
  # `edited` is here for the `changelog` job, which reads the pull request's title for its override:
  # without it a title change runs nothing, and a green status could outlive the title that earned
  # it (raised by Copilot on #98). It re-runs the whole workflow on a title, body or base edit — every
  # job, because a skipped job reports success to a required check and could stand in for a real
  # failure. Naming any type replaces the defaults, so they are listed too.
  #
  # A base edit leaves the head commit unchanged, so a required check that does not re-run keeps the
  # status it had against the old base (raised by Copilot on #98). `branch-freshness` measures the
  # branch against its base, so it re-runs on `edited` too. `copilot-reviewed` asks for a round on
  # the head, which a retarget does not change, so a re-run would give the same answer; and `analyze`
  # runs only for pull requests into `main`, so one retargeted into `main` has no status to reuse and
  # waits for a push. Whether `copilot-reviewed` should also judge the base is an open question in
  # `.portulan/handoffs/2026-09-15-the-questions-81-left-open.md`.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least privilege: nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest entry is the major line of the `engines.node` floor in package.json;
        # tests/workflows/node-support.test.ts holds the two in agreement.
        node: ["22", "24"]
    steps:
      # Actions are pinned to a commit SHA: a mutable tag like @v5 can be
      # repointed at arbitrary code by anyone who can push to that repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      # Coverage rather than plain test: the config sets 100% thresholds, so
      # this is what actually enforces them.
      - run: npm run test:coverage

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  # The compiled gate artifacts must match the policy they claim to compile.
  #
  # This could not run in CI while the Claude Code artifact carried an absolute path into one
  # machine's plugin cache: CI would recompile with a different runner path and report drift that
  # was not drift. With the CLI installed as a dev dependency the hook command is
  # `${CLAUDE_PROJECT_DIR}`-relative — a literal string, identical on every machine — so `--check`
  # compares like with like and a real edit to `.portulan/gates.json` that was never recompiled is
  # what turns it red.
  #
  # It joins `verify`'s dependencies rather than becoming a required check of its own, so the merge
  # gate covers it without a branch-protection change.
  gate-policy:
    name: gate-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - name: The compiled artifacts match .portulan/gates.json
        run: npx portulan compile --check

  # No entry lands in a section of `CHANGELOG.md` that a tag has already shipped.
  #
  # The changelog is kept by hand, and a release is recorded by inserting its heading below
  # `## [Unreleased]` — so the list that was Unreleased's becomes the release's, and a branch that
  # had appended an entry to that list merges cleanly with the entry under a release it is not part
  # of. Measured on 2026-09-14 with `git merge-file`, #81's entry over `main` as #78 left it: zero
  # conflicts, the entry under `## [2.0.0]`, and both test files that read `CHANGELOG.md` still
  # green with it there, 12 of 12. It was caught only because #77 had edited the same lines.
  #
  # The tag decides, not the heading: #77 filed its entry under a recorded, untagged 2.0.0 fifteen
  # seconds after #78 and four minutes before the tag, correctly. So the script asks GitHub whether
  # the change's base already contains `v{version}`, for a section that changed and no other: contains,
  # not merely whether the tag exists by the time this runs, because a release can tag the very
  # commit a push brought in after that push (raised by Copilot on #98). CI cannot look itself: the
  # checkout is one commit with no tags. See `scripts/changelog-sections.mjs`.
  #
  # It runs on push as well as on pull_request because nothing re-runs a pull request's check when
  # a tag appears: neither a new commit on `main` nor a new tag starts a pull_request run, so a pull
  # request checked before a release is tagged can merge after it, unchanged (raised by Copilot on
  # #98: the old wording, "when only the base moves", read as a retarget, which `edited` now covers).
  # `strict` being off (`.portulan/gate-map.md`) widens the window to a `main` that has moved, and
  # turning it on would not close it, since a tag moves no branch. On push the comparison is
  # `github.event.before` against the pushed tip, so a misfiling that lands that way turns `main` red.
  #
  # Two gaps are known, and this job closes neither. That red is detection, not prevention: the
  # entry is already on `main` when it shows (raised by Copilot on #98). Preventing it needs the
  # check run again as the pull request merges, against the base and tags as they are then, which
  # needs a branch-protection change such as a merge queue;
  # `.portulan/handoffs/2026-09-15-the-questions-81-left-open.md` leaves that open.
  # And detection can be missed: `concurrency` above cancels a run in progress when another push to
  # `main` arrives, and if that happens before this job finishes, the next run's `before` already
  # contains the entry. #78 and #77 merged fifteen seconds apart, so pushes that close together do
  # happen here.
  #
  # No `npm ci`: the script imports Node built-ins and other files under `scripts/` — the GitHub
  # reader every check shares among them — and nothing installed, so the job installs nothing and
  # caches nothing. `tests/workflows/script-imports.test.ts` holds every script a job runs before its
  # `npm ci`, or without one, to that, because one package import anywhere in the graph would turn a required check
  # red on every pull request at once. It joins `verify`'s dependencies rather than becoming a
  # required check of its own, so the merge gate covers it without a branch-protection change.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    # A few API reads. Unbounded, a stalled one would hold `verify` pending for GitHub's default of 360
    # minutes; this fails it in five, the bound `branch-freshness` has (raised by Copilot on #98).
    timeout-minutes: 5
    # `pull-requests: read` is for one read, on push: which pull request was merged as the pushed
    # commit, whose title the override reads. GitHub's table of what an app's token needs, read on
    # 2026-09-15, lists `commits/{commit_sha}/pulls` under "Pull requests". A job's block replaces the
    # workflow's, so `contents: read` is repeated.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # On pull_request `GITHUB_SHA` is the merge commit and the script reads its first parent — the
      # base as it will be merged into — from the commits API; on push the base is `BEFORE`.
      # `SUBJECT` is the pull request's title on pull_request. On push it is the pushed commit's
      # message, which need not be the title, so the script reads the title of the pull request merged
      # as that commit and falls back to the message only when there is none.
      # `GITHUB_REPOSITORY`, `GITHUB_SHA` and `GITHUB_EVENT_NAME` come from the runner.
      - name: No entry sits in a section a tag has already shipped
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SUBJECT: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: node scripts/changelog-sections.mjs

  # Single stable context for branch protection to require. Matrix job names
  # change whenever the matrix changes; this one does not.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [test, audit, gate-policy, changelog]
    if: always()
    steps:
      # The condition lives in `if:` rather than in shell, so there is no embedded logic to test —
      # DoD 8 is satisfied by there being nothing to extract, not by extracting it. The alternative,
      # a `node scripts/…` step, would force a checkout and a Node setup into a job that otherwise
      # needs neither, to decide one boolean the runner has already computed.
      #
      # Semantics are unchanged from the shell it replaces: `failure` and `cancelled` fail the
      # aggregate, and `skipped` does not. A skipped dependency passing is worth knowing about, but
      # changing what the merge gate accepts is not something to slip into a review round.
      - name: Fail if any dependency job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
