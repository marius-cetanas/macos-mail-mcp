# A pull request waits for the Copilot round on the commit it is actually merging.
#
# The policy is `.portulan/gate-map.md`; this file is only the checker.
#
# ## Why this exists: resolution was only half the rule
#
# `main` already requires conversation resolution, which covers the RESOLVED half — a Copilot thread
# cannot be ignored. Nothing covered the AWAITED half, so a merge could land in the window between
# the final push and the review arriving, leaving a round that describes the merged tree answered by
# nobody in particular.
#
# ## Waiting is not failing
#
# The job waits inside the run it already has. While a round is owed and has not arrived the job is
# simply still running — a pending check, not a red one. Red means the budget expired, which is a
# statement that something went wrong rather than that something was slow.
#
# ## It also asks, because waiting alone was not enough (#44)
#
# The round has to be requested by somebody. The ruleset does it for most pull requests and not for
# all of them, and the ones it skips could never go green no matter how long this waited. So the
# job now requests the round itself when none is pending — at most once per run, and never when the
# ruleset already has one in flight.
#
# ## Asking does not cover a Dependabot pull request (#58)
#
# Measured on #55, #56 and #57: the mutation is accepted, the job logs that it asked, and no
# `review_requested` event is ever recorded — so all three expired red and no push could have
# changed that. Not a token problem; this job's own log reports `PullRequests: write`. Requested
# under a user-scoped token the same three drew a round in five seconds.
#
# The mechanism is documented and it is billing attribution: a Copilot review must be charged to a
# Copilot-licensed account, a manual request by a **user** is attributed to that user, and in the
# failing cell there is no such account — an app requester is not a user and the author is a bot.
# GitHub's fix for it is an organization policy on Copilot Business/Enterprise, and this repository
# is user-owned, so it is not available here. `pull_request_target` does not help: it changes the
# token, not the actor. Only a user-scoped token would, and that is a stored credential and a
# gate-map decision.
#
# So the gate stops asking for a round it cannot get. When the mutation's own answer says the
# request was not recorded, the job waits for a **human review of the head** instead — the same
# answer it already gives a diff Copilot will not read. A Dependabot bump used to cost four manual
# steps (hand-request the round, wait for it to be declined, review, re-run); the first two only
# ever produced a round known to be empty, and are gone. See #58 for the citations.
#
# ## A round is not a review just because it arrived (#54)
#
# Copilot submits a review in two cases where nobody looked, and the check counted both. They get
# different answers, because only one of them can be fixed by asking again:
#
#   * an error round is transient — the job keeps waiting, and asks again;
#   * "wasn't able to review any files", what Copilot returns for a lockfile-only diff, is
#     permanent for that diff. No round is coming, so the review that is owed is a person's: the
#     job waits for a human review of that head and asks Copilot for nothing.
#
# So a Dependabot lockfile bump costs one human review per bump, deliberately. A lockfile is where
# a supply-chain change arrives, which is the diff least worth waving through, and the alternative
# considered — exempting it outright — is the same gate with nobody looking.
#
# **Any human review counts, not only an approval**, and that is a deadlock guard rather than
# laxity: GitHub forbids approving your own pull request, so an APPROVED-only rule would make a
# maintainer-authored lockfile change unmergeable by anyone here. A `COMMENTED` review is allowed
# on your own pull request, so the rule stays satisfiable in every case.
#
# ## `pull_request_review` is deliberately not a trigger
#
# It would be the obvious way to turn the check green the moment a review lands, and it does not
# work: the triggering actor is a bot, so GitHub holds the run as `action_required` awaiting a
# maintainer's click. The awaited guarantee would then cost one click per pull request. Waiting
# inside a `pull_request` run costs none.
name: copilot review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# Read-only by default; the job below widens exactly one scope. Same shape as `release.yml`, which
# keeps `contents: read` here and grants what it needs per job.
permissions:
  contents: read

jobs:
  copilot-reviewed:
    runs-on: ubuntu-latest
    # `pull-requests: write` buys exactly one call: requesting the Copilot round when nothing else
    # has.
    #
    # This was `read`, on the reasoning that the repository ruleset carries `review_on_push: true`
    # so the platform always requests the round and this job never needs to ask. Measured, that is
    # false for two kinds of pull request this check gates — a non-default base, where the
    # ruleset's `~DEFAULT_BRANCH` condition never matches, and a bot author, where #47 drew no
    # round in 16 hours against `main` while #43/#45/#46/#48 were each requested one second after
    # opening. Both produced a red required check that no push could turn green. See #44 and
    # `scripts/copilot-round.mjs`.
    #
    # The write scope is what the ask needs, and it is not what the ask lacks on a Dependabot pull
    # request: the token carries it there and the request still records nothing (#58). Widening
    # this further would not help — the scope is already granted.
    #
    # Job-level rather than workflow-level, because job-level REPLACES the workflow block rather
    # than merging with it: declared in both places, whichever sits here is what the token gets,
    # and a `read` left behind here would silently undo the widening above. One place, and the
    # suite asserts the effective value rather than a literal.
    #
    # `contents` stays read: this job never checks anything out beyond the scripts it runs.
    permissions:
      contents: read
      pull-requests: write
    # The wait budget is 10 minutes (DEFAULT_BUDGET_MS, pinned by a test); this is the backstop
    # for a job that hangs somewhere other than the wait.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: A Copilot round has landed on the current head commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/copilot-round.mjs
