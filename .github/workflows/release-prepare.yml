name: Release prepare

# Step 1 of 2. Run this manually when you want to cut a release.
#
# Derives the next version from the conventional commits accumulated since the
# last release tag, runs every check, and pushes a release branch carrying the
# version bump and changelog entry. It does NOT publish and does NOT open the
# pull request.
#
# Opening the PR is left to you on purpose: a pull request created with
# GITHUB_TOKEN does not trigger workflow runs, so `ci-ok` would never report and
# branch protection would leave it permanently unmergeable. The job prints a
# one-click link.
#
# Merging that PR is what publishes — see release.yml.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump — auto derives it from the commits"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Report the computed version and stop"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history and tags to derive the version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      - name: Derive the next version
        id: version
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if ! node scripts/next-version.mjs --current "$CURRENT" --force "${{ inputs.bump }}" > version.json; then
            echo "::error::No releasable commits since the last release. Nothing to publish."
            cat version.json
            exit 1
          fi
          cat version.json
          {
            echo "next=$(node -p "require('./version.json').version")"
            echo "bump=$(node -p "require('./version.json').bump")"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

      - name: Report (dry run)
        if: inputs.dry_run
        run: |
          {
            echo "### Dry run — nothing was pushed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Current | ${{ steps.version.outputs.current }} |"
            echo "| Next | **${{ steps.version.outputs.next }}** |"
            echo "| Bump | ${{ steps.version.outputs.bump }} |"
            echo
            echo "All checks passed. Re-run with \`dry_run\` unchecked to push the release branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the release branch
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version --no-git-tag-version "$NEXT"

          # Prepend a dated section. Deliberately terse — the PR is where it
          # gets edited into prose before anyone merges it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const next = process.env.NEXT;
            const date = new Date().toISOString().slice(0, 10);
            // No tag yet on a first-ever release; log from the start of history
            // instead of letting git describe throw and block the initial cut.
            let range = "HEAD";
            try {
              const since = execFileSync("git", ["describe","--tags","--abbrev=0","--match","v*"], {encoding:"utf8", stdio:["ignore","pipe","ignore"]}).trim();
              if (since !== "") range = `${since}..HEAD`;
            } catch {}
            const log = execFileSync("git", ["log", range, "--pretty=format:- %s"], {encoding:"utf8"}).trim();
            const path = "CHANGELOG.md";
            const body = readFileSync(path, "utf8");
            const marker = body.indexOf("\n## ");
            const entry = `\n## [${next}] - ${date}\n\n### Changed\n\n${log}\n`;
            writeFileSync(path, body.slice(0, marker) + entry + body.slice(marker));
          '

          git checkout -b "release/v$NEXT"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $NEXT"
          git push origin "release/v$NEXT"

          {
            echo "### Release branch pushed"
            echo
            echo "**${{ steps.version.outputs.current }} → $NEXT** (${{ steps.version.outputs.bump }})"
            echo
            echo "[Open the pull request](https://github.com/${{ github.repository }}/compare/main...release/v$NEXT?expand=1)"
            echo
            echo "Open it yourself rather than letting the workflow do it — a PR created by"
            echo "GITHUB_TOKEN does not trigger CI, and \`ci-ok\` is a required check."
            echo
            echo "Edit the changelog in the PR, then merge. **Merging publishes $NEXT to npm.**"
          } >> "$GITHUB_STEP_SUMMARY"
