name: Release

# Step 2 of 2. Publishes the version currently on main. Run it deliberately,
# when you decide to ship.
#
# Merging a pull request never ships anything. Any number of them can land on
# main between releases; this workflow ships whatever version is there when you
# run it, so merge volume never drives the version number.
#
# There is deliberately no tag trigger and no push trigger. A tag is permanent
# and public, so a tag that fails to publish leaves a tag pointing at a version
# that does not exist on the registry — which is exactly what happened to
# v1.3.0. Here the tag is an output of a successful publish, never its trigger.
#
# Authentication is npm Trusted Publishing (OIDC); there is no NPM_TOKEN.
# One-time setup on npmjs.com → the package → Settings → Trusted Publisher:
#   Provider: GitHub Actions · Repository: marius-cetanas/macos-mail-mcp
#   Workflow: release.yml · Action: npm publish
# Renaming this file breaks publishing until that entry is updated.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and stop before publishing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # required for Trusted Publishing and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No `registry-url`: it makes setup-node write `_authToken=${NODE_AUTH_TOKEN}`
      # into a generated .npmrc, and an empty token still reads as configured
      # auth, so npm skips OIDC and publishes anonymously (actions/setup-node#1551).
      # No `cache`: npm advises against caching in release builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Asserts the floor rather than installing npm@latest. Upgrading the
      # toolchain mid-release makes the pipeline non-deterministic: a new npm
      # major could change publish behaviour on a run nobody changed.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e '
            const version = process.argv[1];
            const [maj, min, pat] = version.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`::error::npm ${version} is below the 11.5.1 floor for trusted publishing. Raise the Node version this workflow pins.`);
              process.exit(1);
            }
            console.log(`npm ${version} meets the 11.5.1 floor.`);
          ' "$(npm --version)"

      - name: Publish only from the default branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases publish from main only (got $GITHUB_REF_NAME)."
            exit 1
          fi
          echo "On main."

      - name: Preflight — nothing is disabling OIDC
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint — the job lacks 'id-token: write'."
            exit 1
          fi
          echo "OIDC token endpoint present."
          node scripts/check-npmrc.mjs \
            "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" \
            "$HOME/.npmrc" \
            ./.npmrc
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error(`::error::Node ${process.versions.node} is below the 22.14.0 floor for trusted publishing.`);
              process.exit(1);
            }
            console.log(`Node ${process.versions.node} meets the floor.`);
          '

      - run: npm ci

      # Unconditional on purpose. On the previous revision this was gated to tag
      # runs, so a dispatch publish skipped it entirely — caught in review of #23.
      - name: Verify the version is releasable
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "macos-mail-mcp@$PKG" version >/dev/null 2>&1; then
            echo "::error::macos-mail-mcp@$PKG is already on the registry. npm will not republish a version."
            exit 1
          fi
          if git rev-parse "v$PKG" >/dev/null 2>&1; then
            echo "::error::Tag v$PKG already exists but $PKG is not published. Resolve by hand."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG."

      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

      - name: Publish (dry run)
        if: inputs.dry_run
        run: |
          npm publish --dry-run
          echo "Dry run — nothing was published, tagged or released."

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish

      - name: Confirm it landed
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 1 10); do
            sleep 6
            if npm view "macos-mail-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "Published macos-mail-mcp@$VERSION."
              if npm view "macos-mail-mcp@$VERSION" dist.attestations >/dev/null 2>&1; then
                echo "Provenance attestation present."
              else
                echo "::warning::No provenance attestation — the publish did not go through OIDC."
              fi
              exit 0
            fi
          done
          echo "::error::$VERSION is not on the registry although publishing reported success."
          exit 1

      # Tag and release only after the registry has confirmed the version, so a
      # failed publish never leaves a dangling tag.
      - name: Tag and cut the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"
          awk "/^## \[$VERSION\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --latest --notes-file notes.md
