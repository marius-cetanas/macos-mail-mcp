version: 2
updates:
  # Runtime and dev dependencies. This package is published to npm, so a
  # compromised or vulnerable transitive dependency reaches every install.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # `@vitest/coverage-v8` peers on the exact `vitest` version, so the two only
      # install as a pair. `dev-dependencies` takes minor and patch updates, which
      # let a major arrive as `vitest` alone and fail `npm ci` on ERESOLVE (#71).
      # This group takes every update type for the pair, and `dev-dependencies`
      # excludes it, so a version update always moves both.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - "vitest"
          - "@vitest/*"

  # Workflow actions are pinned to commit SHAs; without this they would never
  # be updated, and a pinned SHA does not receive security fixes on its own.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # codeql-action ships init and analyze as separate updatable paths, and
      # CodeQL refuses a run whose steps are not the same version: "Loaded a
      # configuration file for version 'X', but running version 'Y'". Ungrouped,
      # Dependabot opens one PR per path, and each is red on its own because it
      # moves half the pair. Grouping makes the pair one PR, which is the only
      # shape that can go green.
      codeql-action:
        patterns:
          - "github/codeql-action*"
